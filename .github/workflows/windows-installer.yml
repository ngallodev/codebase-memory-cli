name: Windows Installer

# Build-only pipeline: compiles the Windows CLI (with UI) per architecture,
# packages the same zip archives the release publishes, and wraps them in an
# Inno Setup installer. By request it runs NO tests, lint, soak, smoke,
# antivirus scan, attestation or CodeQL, and it publishes nothing: no release,
# no tag. The only output is a workflow artifact. The optional smoke_install
# input adds one job that installs and uninstalls the amd64 zip through
# install-windows.ps1 in an isolated directory; it is off by default.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp and package (e.g. v0.9.0-dev.1)"
        required: true
        type: string
      arches:
        description: "Architectures to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - amd64
          - arm64
      smoke_install:
        description: "After the build, smoke-test install-windows.ps1 from the amd64 zip (install, Settings entry, uninstall)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce v-prefixed semver version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version OK: $VERSION"
          else
            echo "::error::version must be v-prefixed semver (vX.Y.Z), got '$VERSION'"
            exit 1
          fi

  build-windows-amd64:
    needs: preflight
    if: ${{ inputs.arches != 'arm64' }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            make
            python
            unzip
            zip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # scripts/build.sh is the clean build only (it removes build/c and runs
      # make cbm-with-ui); it runs no tests, lint or gates.
      - name: Build release binary with UI
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++

      - name: Strip, generate notices and package the release zip
        shell: msys2 {0}
        run: |
          scripts/ci/prepare-release-candidates.sh windows amd64 \
            --binary build/c/codebase-memory-cli.exe \
            --out-dir release-candidates
          scripts/gen-third-party-notices.sh \
            release-candidates/windows-amd64/THIRD_PARTY_NOTICES.md
          SELECTED=release-candidates/windows-amd64/stripped/codebase-memory-cli.exe
          SHA="$(sha256sum "$SELECTED" | cut -d' ' -f1)"
          scripts/package-release.sh windows amd64 \
            --selected-binary "$SELECTED" \
            --expected-sha256 "$SHA" \
            --third-party-notices release-candidates/windows-amd64/THIRD_PARTY_NOTICES.md \
            --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip-amd64
          path: dist/codebase-memory-cli-windows-amd64.zip
          if-no-files-found: error

  build-windows-arm64:
    needs: preflight
    if: ${{ inputs.arches != 'amd64' }}
    runs-on: windows-11-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-zlib
            make
            python
            unzip
            zip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build release binary with UI
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++

      - name: Strip, generate notices and package the release zip
        shell: msys2 {0}
        run: |
          scripts/ci/prepare-release-candidates.sh windows arm64 \
            --binary build/c/codebase-memory-cli.exe \
            --out-dir release-candidates
          scripts/gen-third-party-notices.sh \
            release-candidates/windows-arm64/THIRD_PARTY_NOTICES.md
          SELECTED=release-candidates/windows-arm64/stripped/codebase-memory-cli.exe
          SHA="$(sha256sum "$SELECTED" | cut -d' ' -f1)"
          scripts/package-release.sh windows arm64 \
            --selected-binary "$SELECTED" \
            --expected-sha256 "$SHA" \
            --third-party-notices release-candidates/windows-arm64/THIRD_PARTY_NOTICES.md \
            --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip-arm64
          path: dist/codebase-memory-cli-windows-arm64.zip
          if-no-files-found: error

  installer:
    needs: [build-windows-amd64, build-windows-arm64]
    # A deselected architecture is skipped by design; any failure or
    # cancellation of a selected build blocks the installer.
    if: ${{ !cancelled() && !failure() && (needs.build-windows-amd64.result == 'success' || needs.build-windows-arm64.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-zip-*
          path: stage
          merge-multiple: true

      - name: Stage zips, checksums.txt and install.ps1
        shell: bash
        run: |
          ls -la stage
          cp install.ps1 stage/install.ps1
          (cd stage && sha256sum *.zip > checksums.txt)
          cat stage/checksums.txt

      - name: Compile Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The script uses x64compatible, which needs Inno Setup 6.3 or later.
          # ISCC.exe carries no usable file version (it reads 0.0.0.0), so
          # always let choco install or upgrade to the current release; it is
          # a no-op when the runner already has it. ISCC itself rejects the
          # script if it is too old.
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found" }
          $root = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Path "$root\out" | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/DStageDir=$root\stage" "/DRepoRoot=$root" "/O$root\out" "$root\pkg\windows\codebase-memory-cli.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Assemble the final artifact directory
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          cp stage/*.zip stage/checksums.txt stage/install.ps1 dist/
          SETUP="codebase-memory-cli-${VERSION}-windows-setup.exe"
          cp "out/$SETUP" "dist/$SETUP"
          (cd dist && sha256sum "$SETUP" > SHA256SUMS)
          ls -la dist
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codebase-memory-cli-windows-${{ inputs.version }}
          path: dist
          retention-days: 30
          if-no-files-found: error

  smoke-install:
    needs: build-windows-amd64
    if: ${{ inputs.smoke_install && needs.build-windows-amd64.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-zip-amd64
          path: ${{ runner.temp }}\zip

      - name: Install from the extracted zip, check, then uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'cbm-smoke-install'
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP 'zip\codebase-memory-cli-windows-amd64.zip') -DestinationPath $extract
          foreach ($name in 'codebase-memory-cli.exe', 'LICENSE', 'install.ps1', 'install-windows.ps1', 'THIRD_PARTY_NOTICES.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $extract $name))) { throw "zip is missing $name" }
          }

          $cacheDir = Join-Path $env:RUNNER_TEMP 'cbm-smoke-cache'
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'cbm-smoke-runtime'
          $installer = Join-Path $extract 'install-windows.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -Yes -SkipConfig -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { throw "install-windows.ps1 failed with exit code $LASTEXITCODE" }
          # Second run over the existing install (same-directory replacement)
          # with the cache/runtime options, so the uninstaller must remove the
          # user variables this script set.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -Yes -SkipConfig -InstallDir $installDir -CacheDir $cacheDir -RuntimeDir $runtimeDir
          if ($LASTEXITCODE -ne 0) { throw "install-windows.ps1 re-run failed with exit code $LASTEXITCODE" }
          foreach ($name in 'CBM_CACHE_DIR', 'CBM_RUNTIME_DIR') {
            if (-not [Environment]::GetEnvironmentVariable($name, 'User')) { throw "user variable $name was not set" }
          }

          $exe = Join-Path $installDir 'codebase-memory-cli.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'installed exe is missing' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed with exit code $LASTEXITCODE" }

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\codebase-memory-cli'
          if (-not (Test-Path -LiteralPath $key)) { throw 'Settings > Apps registry key is missing' }
          $entry = Get-ItemProperty -LiteralPath $key
          foreach ($name in 'UninstallString', 'QuietUninstallString', 'DisplayVersion') {
            if ([string]::IsNullOrEmpty($entry.$name)) { throw "registry value $name is missing" }
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $installDir) { throw 'user PATH does not contain the install directory' }

          # Run the registered quiet uninstall command exactly as Windows would.
          $quiet = $entry.QuietUninstallString
          if ($quiet -notmatch '^"([^"]+)"\s+(.*)$') { throw "unexpected QuietUninstallString: $quiet" }
          $quietExe = $Matches[1]
          $quietArgs = $Matches[2]
          $proc = Start-Process -FilePath $quietExe -ArgumentList $quietArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "quiet uninstall failed with exit code $($proc.ExitCode)" }

          if (Test-Path -LiteralPath $key) { throw 'registry key still present after uninstall' }
          if ((Test-Path -LiteralPath $installDir) -and @(Get-ChildItem -LiteralPath $installDir -Force).Count -gt 0) {
            throw 'install directory is not empty after uninstall'
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $installDir) { throw 'user PATH still contains the install directory' }
          foreach ($name in 'CBM_CACHE_DIR', 'CBM_RUNTIME_DIR') {
            if ([Environment]::GetEnvironmentVariable($name, 'User')) { throw "user variable $name was not removed" }
          }
          Write-Host 'install-windows.ps1 smoke passed'
